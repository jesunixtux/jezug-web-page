name: Prepare el pepe AI bundle

on:
  push:
    paths:
      - 'md-s/el pepe/[0-9]*.png'
      - 'md-s/el pepe/README.md'
      - 'tools/prepare_discord_ai_bundle.py'
      - '.github/workflows/prepare-el-pepe-ai-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Build AI-friendly derivatives
        run: python tools/prepare_discord_ai_bundle.py

      - name: Commit generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "md-s/el pepe/ai"
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: regenerate el pepe AI review bundle"
          git push
