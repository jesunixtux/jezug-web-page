<!DOCTYPE html>
<html lang="es" data-root="{{root}}" data-page="{{page}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#10131c">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="{{description}}">
  <title>{{title}} — Alejandría</title>
  <script src="{{root}}assets/theme.js"></script>
  <link rel="stylesheet" href="{{root}}assets/site.css">
  <script src="{{root}}assets/search-index.js" defer></script>
  <script src="{{root}}assets/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand-row">
        <a class="brand" href="{{root}}index.html" aria-label="Alejandría — Inicio"><strong>Alejandría<span aria-hidden="true">.</span></strong><small>Archivo histórico</small></a>
        <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false" hidden>Menú <span aria-hidden="true">☰</span></button>
      </div>
      <nav id="site-nav" class="nav" aria-label="Navegación principal">{{navigation}}</nav>
      <div class="side-note"><span class="eyebrow">En construcción</span><p>Leer con contexto.<br>Reconocer los límites.</p><a href="{{root}}Informacion/index.html#limitaciones">Sobre este archivo <span aria-hidden="true">↗</span></a></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <form class="searchbar" role="search" action="{{root}}buscar/index.html" method="get">
          <label class="sr-only" for="site-search">Buscar en el contenido público</label>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input id="site-search" name="q" type="search" placeholder="Buscar en el archivo público…" maxlength="200" enterkeyhint="search">
          <button type="submit" aria-label="Buscar">↵</button>
        </form>
        <button class="theme-toggle" type="button" aria-label="Activar modo claro" aria-pressed="false" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15A8.5 8.5 0 0 1 9 4 9 9 0 1 0 20 15Z"/></svg></button>
      </header>
      <main id="contenido" tabindex="-1">
        <nav class="breadcrumbs" aria-label="Ruta de navegación">{{breadcrumbs}}</nav>
        {{content}}
        <footer class="footer"><div><strong>Alejandría</strong><p>Archivo histórico y reconstrucción documental.</p></div><div><a href="{{root}}Informacion/index.html">Transparencia</a><span>Una perspectiva interesada, no un veredicto.</span></div></footer>
      </main>
    </div>
  </div>
</body>
</html>
